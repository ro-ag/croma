name: CI

on:
  # Docs-only changes don't affect the build or tests; skip CI for them. Code,
  # workflow, and config files are absent from paths-ignore and always run.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - ".gitignore"
      - ".gitattributes"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-08-05
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The MusicXML reader feature (the default library build stays dep-free).
      - run: cargo test -p croma-core --features musicxml-reader
      - run: cargo clippy -p croma-core --all-targets --features musicxml-reader -- -D warnings
      - name: croma-core default build stays zero-dep
        run: |
          lines=$(cargo tree -p croma-core --edges normal | wc -l | tr -d ' ')
          test "$lines" = "1" || { echo "croma-core gained a normal dependency:"; cargo tree -p croma-core --edges normal; exit 1; }

  linux-nix:
    name: Linux (nixos-unstable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nixos-unstable
      - name: Build dev shell
        run: nix build --no-link .#devShells.x86_64-linux.default
      - run: nix develop --command cargo fmt --all --check
      - run: nix develop --command cargo test --workspace
      - run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings
      # The MusicXML reader feature (the default library build stays dep-free).
      - run: nix develop --command cargo test -p croma-core --features musicxml-reader
      - run: nix develop --command cargo clippy -p croma-core --all-targets --features musicxml-reader -- -D warnings
