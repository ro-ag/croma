name: publish

# Publish the workspace crates to crates.io. Fires on a `v*` tag — the same
# trigger as the binary release — so a tagged release auto-publishes. A manual
# workflow_dispatch publishes only when run on a `v*` tag; on any other ref
# every job is skipped. Publishing waits for the `verify` job, so a tag whose
# commit fails fmt, clippy or tests publishes nothing.
#
# Crates publish in dependency order (croma-core → croma-fmt → croma-cli →
# croma-lsp). Dependents are retried while the index propagates, and an
# already-published version is treated as success, so the workflow is safe to
# re-run. Requires the CARGO_REGISTRY_TOKEN repo secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Cheap Linux gate: the crates and binaries ship only if the tagged commit
  # passes the same checks as CI (fmt, clippy, tests, reader feature).
  verify:
    name: Verify (fmt, clippy, tests)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-08-05
        with:
          toolchain: "1.96.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verify
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p croma-core --features musicxml-reader
      - run: cargo clippy -p croma-core --all-targets --features musicxml-reader -- -D warnings

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-08-05
        with:
          toolchain: "1.96.0"

      # Warm the publish: cargo publish recompiles each crate, so cache
      # target/ + registry instead of paying a cold 4x compile every tag.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          publish() {
            crate="$1"
            for attempt in 1 2 3 4 5 6; do
              out="$(cargo publish -p "$crate" 2>&1)"; rc=$?
              printf '%s\n' "$out"
              if [ "$rc" -eq 0 ]; then return 0; fi
              if printf '%s' "$out" | grep -qiE "already (exists|uploaded)|already published|crate version .* is already"; then
                echo "::notice::$crate is already on crates.io — skipping"
                return 0
              fi
              echo "::warning::$crate publish attempt $attempt failed (rc=$rc); retrying in 30s for index propagation"
              sleep 30
            done
            echo "::error::failed to publish $crate after retries"
            return 1
          }
          publish croma-core
          publish croma-fmt
          publish croma-cli
          publish croma-lsp
